services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: schedule-optimizer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/frontend
      - ./uploads:/app/uploads
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
    restart: unless-stopped
