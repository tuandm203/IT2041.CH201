services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: schedule-optimizer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/frontend
      - ./uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_DIR=/app/uploads
    restart: unless-stopped
